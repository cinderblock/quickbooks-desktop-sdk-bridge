name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The bridge depends on pywin32 and is deployed on Windows next to
    # QuickBooks Desktop, whose COM SDK needs 32-bit Python (.python-version).
    # The tests use a FakeQBSession and monkeypatched COM, so no QuickBooks
    # or company file is needed here.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x86
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Pytest
        run: pytest tests -q
