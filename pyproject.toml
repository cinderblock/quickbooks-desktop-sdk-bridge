[project]
name = "qb-bridge"
version = "0.1.0"
description = "REST API bridge to QuickBooks Desktop"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pywin32>=310",
    "lxml>=5.0",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.18",
    "reportlab>=4.0",
    "pydantic-settings>=2.0",
    "itsdangerous>=2.1",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "httpx>=0.28",
]

[project.scripts]
qb-bridge = "qb_bridge.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qb_bridge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # Depends() in defaults is standard FastAPI pattern
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
